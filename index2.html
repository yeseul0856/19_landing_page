<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="도시의 새로운 여유, 아르코 레지던스와 어반 스위트를 만나보세요."
    />
    <meta name="theme-color" content="#e9e6df" />
    <title>아르코 레지던스 | 당신의 다음 장면</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="gateway" aria-label="아르코 주거 공간 선택">
      <a class="destination destination--home" href="https://www.anadd.co.kr/apt/">
        <div class="architecture architecture--home" aria-hidden="true">
          <span class="architecture__tower"></span>
          <span class="architecture__lowrise"></span>
          <span class="architecture__sun"></span>
        </div>
        <div class="destination__content">
          <div class="destination__topline">
            <span class="wordmark">ARCO</span>
            <span class="destination__index">01 / RESIDENCE</span>
          </div>
          <div class="destination__intro">
            <p class="eyebrow">THE ART OF LIVING</p>
            <h1>아파트</h1>
            <p class="destination__description">
              매일의 풍경이 특별해지는 곳,<br />
              당신의 새로운 일상을 시작하세요.
            </p>
          </div>
          <div class="destination__bottom">
            <span class="destination__cta">레지던스 둘러보기</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </div>
      </a>

      <a class="destination destination--suite" href="https://www.anadd.co.kr/officetel/">
        <div class="architecture architecture--suite" aria-hidden="true">
          <span class="architecture__tower"></span>
          <span class="architecture__lowrise"></span>
          <span class="architecture__sun"></span>
        </div>
        <div class="destination__content">
          <div class="destination__topline">
            <span class="wordmark">ARCO</span>
            <span class="destination__index">02 / CITY SUITE</span>
          </div>
          <div class="destination__intro">
            <p class="eyebrow">A NEW CITY RHYTHM</p>
            <h2>오피스텔</h2>
            <p class="destination__description">
              일과 쉼이 자연스럽게 이어지는<br />
              도심 속 나만의 균형을 만나보세요.
            </p>
          </div>
          <div class="destination__bottom">
            <span class="destination__cta">시티 스위트 둘러보기</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </div>
      </a>
    </main>
  </body>
</html>
